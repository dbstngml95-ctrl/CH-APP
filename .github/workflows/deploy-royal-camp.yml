name: Deploy royal-camp-app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "royal-camp-app-v2/**"
      - "mever-search/**"
      - ".github/workflows/deploy-royal-camp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir _site
          cp -R royal-camp-app-v2/. _site/
          cp -R mever-search _site/mever-search
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

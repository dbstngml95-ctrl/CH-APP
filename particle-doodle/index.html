<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Doodle</title>
<style>
  :root {
    --bg: #0f0f14;
    --panel: rgba(255,255,255,0.06);
    --ink: #f2f0ea;
    --muted: #9a97a3;
    --border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
  }
  canvas { display: block; touch-action: none; }
  .toolbar {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 999px;
    z-index: 10;
  }
  .swatches { display: flex; gap: 8px; }
  .swatch {
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .swatch.active { border-color: white; transform: scale(1.15); }
  .divider { width: 1px; height: 24px; background: var(--border); }
  input[type=range] { width: 90px; accent-color: #e8735c; }
  .toolbar button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .toolbar button:hover { background: rgba(255,255,255,0.1); }
  .hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 13px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">마우스나 손가락으로 그려보세요 ✨</div>
<div class="toolbar">
  <div class="swatches" id="swatches"></div>
  <div class="divider"></div>
  <input type="range" id="size" min="2" max="40" value="10" />
  <div class="divider"></div>
  <button id="clearBtn">지우기</button>
  <button id="saveBtn">저장</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const colors = ['#e8735c', '#f2c14e', '#6fae8f', '#5b8def', '#c77dff', '#f2f0ea'];
let currentColor = colors[0];
let brushSize = 10;

const swatchWrap = document.getElementById('swatches');
colors.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'swatch' + (i === 0 ? ' active' : '');
  el.style.background = c;
  el.addEventListener('click', () => {
    currentColor = c;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  });
  swatchWrap.appendChild(el);
});

document.getElementById('size').addEventListener('input', e => brushSize = Number(e.target.value));
document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.length = 0;
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'doodle.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

let particles = [];
let drawing = false;
let lastPos = null;

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

function spawnParticles(x, y) {
  const [r, g, b] = hexToRgb(currentColor);
  const count = 3;
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 2.5,
      vy: (Math.random() - 0.5) * 2.5 - 0.5,
      life: 1,
      size: brushSize * (0.5 + Math.random() * 0.7),
      r, g, b
    });
  }
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.touches && e.touches[0]) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function strokeTo(pos) {
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = brushSize;
  ctx.beginPath();
  if (lastPos) {
    ctx.moveTo(lastPos.x, lastPos.y);
  } else {
    ctx.moveTo(pos.x, pos.y);
  }
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  spawnParticles(pos.x, pos.y);
  lastPos = pos;
}

function start(e) {
  drawing = true;
  lastPos = null;
  strokeTo(getPos(e));
}
function move(e) {
  if (!drawing) return;
  e.preventDefault();
  strokeTo(getPos(e));
}
function end() {
  drawing = false;
  lastPos = null;
}

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
window.addEventListener('mouseup', end);
canvas.addEventListener('touchstart', start, { passive: false });
canvas.addEventListener('touchmove', move, { passive: false });
canvas.addEventListener('touchend', end);

function animate() {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.life * 0.5})`;
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

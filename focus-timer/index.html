<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8578;
    --accent: #e8735c;
    --accent-2: #6fae8f;
    --ring-bg: #ece7db;
    --border: #e4dfd2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a17;
      --card: #242220;
      --ink: #efe9dd;
      --muted: #9a9384;
      --ring-bg: #35322c;
      --border: #35322c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
  }
  .timer-card { text-align: center; }
  .mode-switch {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .mode-switch button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .mode-switch button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .ring-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto; }
  svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--ring-bg); stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
  .time-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 600; letter-spacing: 1px;
  }
  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .controls button {
    border: none;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  #startBtn { background: var(--accent); color: white; }
  #resetBtn { background: transparent; color: var(--muted); border: 1px solid var(--border) !important; }
  .sessions { margin-top: 14px; color: var(--muted); font-size: 13px; }
  .todo-card h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .todo-input { display: flex; gap: 8px; margin-bottom: 14px; }
  .todo-input input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
  }
  .todo-input button {
    background: var(--accent-2);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    cursor: pointer;
    font-size: 18px;
  }
  #todoList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #todoList li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--bg);
    font-size: 14px;
  }
  #todoList li.done span { text-decoration: line-through; color: var(--muted); }
  #todoList li .del {
    margin-left: auto;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }
  #todoList li input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent-2); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="card timer-card">
    <div class="mode-switch">
      <button data-mins="25" class="active">집중 25</button>
      <button data-mins="5">휴식 5</button>
      <button data-mins="15">긴 휴식 15</button>
    </div>
    <div class="ring-wrap">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
        <circle id="ringFg" class="ring-fg" cx="110" cy="110" r="100"></circle>
      </svg>
      <div class="time-label" id="timeLabel">25:00</div>
    </div>
    <div class="controls">
      <button id="startBtn">시작</button>
      <button id="resetBtn">리셋</button>
    </div>
    <div class="sessions" id="sessionCount">오늘 완료한 세션: 0</div>
  </div>

  <div class="card todo-card">
    <h2>할 일</h2>
    <div class="todo-input">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" />
      <button id="addBtn">+</button>
    </div>
    <ul id="todoList"></ul>
  </div>
</div>

<script>
const RADIUS = 100;
const CIRC = 2 * Math.PI * RADIUS;
const ringFg = document.getElementById('ringFg');
ringFg.style.strokeDasharray = CIRC;
ringFg.style.strokeDashoffset = 0;

let totalSeconds = 25 * 60;
let remaining = totalSeconds;
let timerId = null;
let running = false;

const timeLabel = document.getElementById('timeLabel');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const sessionCountEl = document.getElementById('sessionCount');
let sessions = Number(localStorage.getItem('focusSessions') || 0);
sessionCountEl.textContent = `오늘 완료한 세션: ${sessions}`;

function render() {
  const m = Math.floor(remaining / 60).toString().padStart(2, '0');
  const s = (remaining % 60).toString().padStart(2, '0');
  timeLabel.textContent = `${m}:${s}`;
  const progress = 1 - remaining / totalSeconds;
  ringFg.style.strokeDashoffset = CIRC * (1 - progress);
}

function tick() {
  if (remaining <= 0) {
    clearInterval(timerId);
    running = false;
    startBtn.textContent = '시작';
    sessions++;
    localStorage.setItem('focusSessions', sessions);
    sessionCountEl.textContent = `오늘 완료한 세션: ${sessions}`;
    new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play().catch(()=>{});
    return;
  }
  remaining--;
  render();
}

startBtn.addEventListener('click', () => {
  if (running) {
    clearInterval(timerId);
    running = false;
    startBtn.textContent = '시작';
  } else {
    running = true;
    startBtn.textContent = '일시정지';
    timerId = setInterval(tick, 1000);
  }
});

resetBtn.addEventListener('click', () => {
  clearInterval(timerId);
  running = false;
  startBtn.textContent = '시작';
  remaining = totalSeconds;
  render();
});

document.querySelectorAll('.mode-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-switch button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    clearInterval(timerId);
    running = false;
    startBtn.textContent = '시작';
    totalSeconds = Number(btn.dataset.mins) * 60;
    remaining = totalSeconds;
    render();
  });
});

// Todo list
const todoInput = document.getElementById('todoInput');
const addBtn = document.getElementById('addBtn');
const todoList = document.getElementById('todoList');
let todos = JSON.parse(localStorage.getItem('focusTodos') || '[]');

function saveTodos() {
  localStorage.setItem('focusTodos', JSON.stringify(todos));
}

function renderTodos() {
  todoList.innerHTML = '';
  if (todos.length === 0) {
    todoList.innerHTML = '<div class="empty">할 일이 없습니다</div>';
    return;
  }
  todos.forEach((t, i) => {
    const li = document.createElement('li');
    if (t.done) li.classList.add('done');
    li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''}/><span></span><span class="del">삭제</span>`;
    li.querySelector('span:not(.del)').textContent = t.text;
    li.querySelector('input').addEventListener('change', () => {
      todos[i].done = !todos[i].done;
      saveTodos();
      renderTodos();
    });
    li.querySelector('.del').addEventListener('click', () => {
      todos.splice(i, 1);
      saveTodos();
      renderTodos();
    });
    todoList.appendChild(li);
  });
}

function addTodo() {
  const val = todoInput.value.trim();
  if (!val) return;
  todos.push({ text: val, done: false });
  todoInput.value = '';
  saveTodos();
  renderTodos();
}

addBtn.addEventListener('click', addTodo);
todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

render();
renderTodos();
</script>
</body>
</html>

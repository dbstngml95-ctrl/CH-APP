<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Breaker</title>
<style>
  :root {
    --bg: #14151c;
    --ink: #f2f0ea;
    --muted: #8b8a99;
    --accent: #e8735c;
    --panel: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 14px;
    color: var(--muted);
    width: 480px;
    justify-content: space-between;
  }
  .hud span b { color: var(--ink); }
  canvas {
    background: #1c1d27;
    border: 1px solid var(--border);
    border-radius: 14px;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: rgba(20,21,28,0.85);
    border-radius: 14px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 22px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  .overlay button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .stage { position: relative; }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>점수: <b id="score">0</b></span>
    <span>레벨: <b id="level">1</b></span>
    <span>목숨: <b id="lives">3</b></span>
  </div>
  <div class="stage">
    <canvas id="c" width="480" height="560"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Block Breaker</h2>
      <p id="overlayMsg">마우스나 방향키로 패들을 움직여 공을 튕겨내세요</p>
      <button id="overlayBtn">시작</button>
    </div>
  </div>
  <div class="hint">← → 방향키 또는 마우스 이동 · 스페이스로 발사</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const overlayBtn = document.getElementById('overlayBtn');

const PADDLE_W = 90, PADDLE_H = 12;
const BALL_R = 7;
const ROWS = 5, COLS = 8;
const BRICK_W = 52, BRICK_H = 18, BRICK_GAP = 6, BRICK_TOP = 50;
const brickColors = ['#e8735c', '#f2c14e', '#6fae8f', '#5b8def', '#c77dff'];

let paddle, ball, bricks, score, lives, level, running, launched;

function initLevel(lv) {
  bricks = [];
  const offsetX = (W - (COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP)) / 2;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      bricks.push({
        x: offsetX + c * (BRICK_W + BRICK_GAP),
        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W, h: BRICK_H,
        color: brickColors[r % brickColors.length],
        alive: true
      });
    }
  }
  paddle = { x: W / 2 - PADDLE_W / 2, y: H - 30, w: PADDLE_W, h: PADDLE_H };
  const speed = 4 + (lv - 1) * 0.6;
  ball = { x: W / 2, y: paddle.y - BALL_R - 1, vx: speed * 0.6, vy: -speed };
  launched = false;
}

function resetGame() {
  score = 0; lives = 3; level = 1;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
  initLevel(level);
}

function showOverlay(title, msg, btnText) {
  overlayTitle.textContent = title;
  overlayMsg.textContent = msg;
  overlayBtn.textContent = btnText;
  overlay.classList.add('show');
  running = false;
}

overlayBtn.addEventListener('click', () => {
  overlay.classList.remove('show');
  if (overlayBtn.textContent === '시작' || overlayBtn.textContent === '다시 시작') {
    resetGame();
  }
  running = true;
  loop();
});

let keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') launched = true;
});
document.addEventListener('keyup', e => keys[e.key] = false);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.min(Math.max(mx - paddle.w / 2, 0), W - paddle.w);
});
canvas.addEventListener('mousedown', () => launched = true);
canvas.addEventListener('touchstart', () => launched = true, { passive: true });
canvas.addEventListener('touchmove', e => {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  const mx = (t.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.min(Math.max(mx - paddle.w / 2, 0), W - paddle.w);
  e.preventDefault();
}, { passive: false });

function update() {
  if (keys['ArrowLeft']) paddle.x = Math.max(paddle.x - 6, 0);
  if (keys['ArrowRight']) paddle.x = Math.min(paddle.x + 6, W - paddle.w);

  if (!launched) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - BALL_R - 1;
    return;
  }

  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx *= -1; }
  if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.vx *= -1; }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy *= -1; }

  if (ball.y + BALL_R > paddle.y && ball.y + BALL_R < paddle.y + paddle.h &&
      ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0) {
    const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    const speed = Math.hypot(ball.vx, ball.vy);
    ball.vx = hitPos * speed;
    ball.vy = -Math.sqrt(Math.max(speed * speed - ball.vx * ball.vx, 1));
  }

  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
        ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
      b.alive = false;
      score += 10;
      scoreEl.textContent = score;
      const overlapLeft = (ball.x + BALL_R) - b.x;
      const overlapRight = (b.x + b.w) - (ball.x - BALL_R);
      const overlapTop = (ball.y + BALL_R) - b.y;
      const overlapBottom = (b.y + b.h) - (ball.y - BALL_R);
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
      if (minOverlap === overlapLeft || minOverlap === overlapRight) ball.vx *= -1;
      else ball.vy *= -1;
      break;
    }
  }

  if (ball.y - BALL_R > H) {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) {
      showOverlay('게임 오버', `최종 점수: ${score}`, '다시 시작');
      return;
    }
    launched = false;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - BALL_R - 1;
    ball.vx = 4 * 0.6;
    ball.vy = -4;
  }

  if (bricks.every(b => !b.alive)) {
    level++;
    levelEl.textContent = level;
    showOverlay('레벨 클리어!', `점수: ${score} · 다음 레벨로`, '다음 레벨');
    initLevel(level);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 4);
    ctx.fill();
  }

  ctx.fillStyle = '#f2f0ea';
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();

  ctx.fillStyle = '#e8735c';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
draw();
showOverlay('Block Breaker', '마우스나 방향키로 패들을 움직여 공을 튕겨내세요', '시작');
</script>
</body>
</html>

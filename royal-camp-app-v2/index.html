function makeStore(key, defaults){
  return {
    get(){
      const raw = localStorage.getItem(key);
      if(raw){ try { return JSON.parse(raw); } catch(e){} }
      localStorage.setItem(key, JSON.stringify(defaults));
      return JSON.parse(JSON.stringify(defaults));
    },
    set(val){ localStorage.setItem(key, JSON.stringify(val)); }
  };
}

// ---------------- STATE ----------------
const STATE_KEY = "rc2_participant_state_static";
const EVALUATORS = ["한태희","차세미","성소윤","이준","원강우"];

function loadStates(){
  let raw = localStorage.getItem(STATE_KEY);
  if(raw){
    try {
      const parsed = JSON.parse(raw);
      let migrated = false;
      PARTICIPANTS.forEach(p=>{
        if(!parsed[p.id]){
          const evaluatorVotes = {};
          EVALUATORS.forEach(ev => evaluatorVotes[ev] = null);
          parsed[p.id] = { attendance:"present", attendanceVote:null, evaluatorVotes };
          migrated = true;
          return;
        }
        if(!parsed[p.id].evaluatorVotes){
          parsed[p.id].evaluatorVotes = {};
          migrated = true;
        }
        EVALUATORS.forEach(ev=>{
          if(parsed[p.id].evaluatorVotes[ev] === undefined){ parsed[p.id].evaluatorVotes[ev] = null; migrated = true; }
        });
        if(parsed[p.id].attendanceVote === undefined){ parsed[p.id].attendanceVote = null; migrated = true; }
      });
      if(migrated) localStorage.setItem(STATE_KEY, JSON.stringify(parsed));
      return parsed;
    } catch(e){}
  }
  const s = {};
  PARTICIPANTS.forEach(p=>{
    const evaluatorVotes = {};
    EVALUATORS.forEach(ev => evaluatorVotes[ev] = null);
    s[p.id] = { attendance: (p.id==="p06"||p.id==="p12") ? "absent" : "present", attendanceVote:null, evaluatorVotes };
  });
  localStorage.setItem(STATE_KEY, JSON.stringify(s));
  return s;
}
let pStates = loadStates();
function saveStates(){ localStorage.setItem(STATE_KEY, JSON.stringify(pStates)); }
function penalty(s){
  let p=0;
  if(s.attendanceVote==="down") p+=10;
  EVALUATORS.forEach(ev=>{ if(s.evaluatorVotes && s.evaluatorVotes[ev]==="down") p+=10; });
  return p;
}

let sigCtx, sigDrawing=false, sigHas=false;
function setupSignatureCanvas(){
  const canvas = document.getElementById('sigcanvas');
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle="#2B2118"; sigCtx.lineWidth=2; sigCtx.lineCap="round";
  function pos(e){ const r=canvas.getBoundingClientRect(); const p = e.touches? e.touches[0]: e;
    return {x:(p.clientX-r.left)*canvas.width/r.width, y:(p.clientY-r.top)*canvas.height/r.height}; }
  function start(e){ sigDrawing=true; sigHas=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); }
  function end(){ sigDrawing=false; }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start); canvas.addEventListener('touchmove',move); canvas.addEventListener('touchend',end);
}
function clearSig(){ sigCtx.clearRect(0,0,300,120); sigHas=false; }
function confirmSig(){
  if(!sigHas) return;
  const canvas = document.getElementById('sigcanvas');
  saveAgreement(canvas.toDataURL());
  document.querySelector('.modal-box canvas').style.display='none';
  document.querySelectorAll('.modal-box button').forEach(b=>b.style.display='none');
  document.getElementById('sig-confirmed').style.display='block';
  setTimeout(closeSignature, 900);
}

        <input id="n-dept" class="search" placeholder="담당 부서 (예: 운영본부)" style="margin-bottom:8px;"/>
        <textarea id="n-body" placeholder="내용" style="width:100%;height:70px;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:12.5px;margin-bottom:8px;"></textarea>
        <button onclick="addNotice()" style="width:100%;height:36px;border-radius:8px;background:#111;color:#fff;border:none;font-size:12.5px;">공지 등록</button>
      </div>
      ${notices.map(n=>`
        <div style="border-top:1px solid #f0f0f0;padding:10px 0;display:flex;justify-content:space-between;gap:8px;">
          <div><div style="font-size:12.5px;font-weight:600;">${n.title}</div><div style="font-size:10.5px;color:#999;">${n.date} &middot; ${n.dept}</div></div>
          <button onclick="removeNotice('${n.id}')" style="background:none;border:none;color:#B33A3A;font-size:11px;">삭제</button>
        </div>`).join('')}
    </div>
  `);
}
function addNotice(){
  const title = document.getElementById('n-title').value.trim();
  const dept = document.getElementById('n-dept').value.trim() || "운영본부";
  const body = document.getElementById('n-body').value.trim();
  if(!title || !body) return;
  const notices = getNotices();
  notices.unshift({ id:'n'+Date.now(), title, dept, body, date:new Date().toISOString().slice(0,10).replace(/-/g,'.') });
  noticeStore.set(notices);
  pageAdminNotices();
}
function removeNotice(id){
  noticeStore.set(getNotices().filter(n=>n.id!==id));
  pageAdminNotices();
}

function pageAdminGuidebook(){
  const gb = getGuidebook();
  adminWrap(`
    ${adminSubHeader('가이드북 관리')}
    <div style="padding:16px;">
      ${gb.map((g,i)=>`
        <div style="border:1px solid #f0f0f0;border-radius:10px;padding:12px;margin-bottom:10px;">
          <div style="font-size:12px;font-weight:600;margin-bottom:6px;">${g.no} &middot; ${g.title}</div>
          <textarea id="gb-${i}" style="width:100%;height:80px;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:12px;">${g.body}</textarea>
          <button onclick="saveGuidebookItem(${i})" style="margin-top:6px;height:32px;padding:0 14px;border-radius:8px;background:#111;color:#fff;border:none;font-size:11.5px;">저장</button>
        </div>`).join('')}
    </div>
  `);
}
function saveGuidebookItem(i){
  const gb = getGuidebook();
  gb[i].body = document.getElementById('gb-'+i).value;
  guidebookStore.set(gb);
  alert('저장되었습니다.');
}

function pageAdminScheduleManage(){
  const days = getSchedule();
  const campDays = getCampDays();
  const monthDays = Array.from({length:30},(_,i)=>i+1);
  adminWrap(`
    ${adminSubHeader('일정 관리')}
    <div style="padding:16px;">
      <p style="font-size:12px;font-weight:600;margin-bottom:8px;">캘린더 색칠 관리</p>
      <p style="font-size:11px;color:#999;margin-bottom:8px;">클릭한 날짜가 일정 화면의 달력에서 강조 표시됩니다.</p>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px;max-width:340px;">
        ${monthDays.map(d=>`<button onclick="toggleCampDay(${d});pageAdminScheduleManage()" style="height:30px;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid ${campDays.includes(d)?'#C9A961':'#ddd'};${campDays.includes(d)?'background:#C9A961;color:#0B1F3E;font-weight:600;':'background:#fff;color:#666;'}">${d}</button>`).join('')}
      </div>
      ${days.map((d,di)=>`
        <div style="border:1px solid #f0f0f0;border-radius:10px;padding:12px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <div style="display:flex;gap:6px;">
              <input class="search" style="width:80px;font-weight:600;" value="${d.day}" onchange="updateScheduleDayMeta(${di},'day',this.value)"/>
              <input class="search" style="width:80px;" value="${d.date}" onchange="updateScheduleDayMeta(${di},'date',this.value)"/>
            </div>
            <button onclick="removeScheduleDay(${di})" style="background:none;border:none;color:#B33A3A;font-size:11px;">일차 삭제</button>
          </div>
          ${d.items.map((it,ii)=>`
            <div style="display:flex;gap:6px;margin-bottom:6px;">
              <input class="search" style="width:60px;" value="${it.time}" onchange="updateScheduleItem(${di},${ii},'time',this.value)"/>
              <input class="search" style="flex:1;" value="${it.a}" onchange="updateScheduleItem(${di},${ii},'a',this.value)"/>
              <input class="search" style="flex:1;" value="${it.l}" onchange="updateScheduleItem(${di},${ii},'l',this.value)"/>
              <button onclick="removeScheduleItem(${di},${ii})" style="background:none;border:none;color:#B33A3A;font-size:13px;">&#10005;</button>
            </div>`).join('')}
          <button onclick="addScheduleItem(${di})" style="margin-top:4px;background:none;border:none;color:#666;font-size:11px;">+ 세부일정 추가</button>
        </div>`).join('')}
      <p style="font-size:11px;color:#999;margin-bottom:12px;">시간/활동/장소 칸을 수정하면 자동 저장됩니다.</p>
      <button onclick="addScheduleDay()" style="width:100%;height:44px;border-radius:12px;border:1px dashed #ccc;background:#fafafa;font-size:13px;color:#666;">+ DAY 추가</button>
    </div>
  `);
}
function updateScheduleItem(di,ii,field,value){
  const days = getSchedule();
  days[di].items[ii][field] = value;
  scheduleStore.set(days);
}
function updateScheduleDayMeta(di,field,value){
  const days = getSchedule();
  days[di][field] = value;
  scheduleStore.set(days);
  pageAdminScheduleManage();
}
function addScheduleItem(di){
  const days = getSchedule();
  days[di].items.push({ time:"09:00", a:"", l:"" });
  scheduleStore.set(days);
  pageAdminScheduleManage();
}
function removeScheduleItem(di,ii){
  const days = getSchedule();
  days[di].items.splice(ii,1);
  scheduleStore.set(days);
  pageAdminScheduleManage();
}
function addScheduleDay(){
  const days = getSchedule();
  days.push({ day:`DAY ${days.length+1}`, date:"", items:[] });
  scheduleStore.set(days);
  pageAdminScheduleManage();
}
function removeScheduleDay(di){
  const days = getSchedule();
  days.splice(di,1);
  scheduleStore.set(days);
  pageAdminScheduleManage();
}

function pageAdminMaterials(){
  const materials = getMaterials();
  adminWrap(`
    ${adminSubHeader('캠프자료 관리')}
    <div style="padding:16px;">
      <div style="border:1px solid #f0f0f0;border-radius:10px;padding:12px;margin-bottom:16px;">
        <input id="m-title" class="search" placeholder="자료 제목" style="margin-bottom:8px;"/>
        <input id="m-meta" class="search" placeholder="설명 (예: DAY 2 · 4 PAGES)" style="margin-bottom:8px;"/>
        <button onclick="addMaterial()" style="width:100%;height:36px;border-radius:8px;background:#111;color:#fff;border:none;font-size:12.5px;">자료 등록</button>
      </div>
      ${materials.map(m=>`
        <div style="border-top:1px solid #f0f0f0;padding:10px 0;display:flex;justify-content:space-between;gap:8px;">
          <div><div style="font-size:12.5px;font-weight:600;">${m.title}</div><div style="font-size:10.5px;color:#999;">${m.meta}</div></div>
          <button onclick="removeMaterial('${m.id}')" style="background:none;border:none;color:#B33A3A;font-size:11px;">삭제</button>
        </div>`).join('')}
    </div>
  `);
}
function addMaterial(){
  const title = document.getElementById('m-title').value.trim();
  const meta = document.getElementById('m-meta').value.trim();
  if(!title) return;
  const materials = getMaterials();
  materials.push({ id:'m'+Date.now(), type:'PDF', title, meta });
  materialsStore.set(materials);
  pageAdminMaterials();
}
function removeMaterial(id){
  materialsStore.set(getMaterials().filter(m=>m.id!==id));
  pageAdminMaterials();
}

function pageAdminToday(){
  const tc = getTodayCard();
  adminWrap(`
    ${adminSubHeader('홈 화면 오늘 카드 관리')}
    <div style="padding:16px;">
      <label style="font-size:11px;color:#999;display:block;margin-bottom:4px;">일차 라벨 (예: DAY 2)</label>
      <input id="tc-day" class="search" value="${tc.dayLabel}" style="margin-bottom:10px;"/>
      <label style="font-size:11px;color:#999;display:block;margin-bottom:4px;">날짜 (예: JUN 12)</label>
      <input id="tc-date" class="search" value="${tc.date}" style="margin-bottom:10px;"/>
      <label style="font-size:11px;color:#999;display:block;margin-bottom:4px;">안내 문구</label>
      <textarea id="tc-desc" style="width:100%;height:80px;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:12.5px;margin-bottom:12px;">${tc.desc}</textarea>
      <button onclick="saveTodayCard()" style="width:100%;height:40px;border-radius:10px;background:#111;color:#fff;border:none;font-size:13px;">저장</button>
    </div>
  `);
}
function saveTodayCard(){
  setTodayCard({
    dayLabel: document.getElementById('tc-day').value.trim(),
    date: document.getElementById('tc-date').value.trim(),
    desc: document.getElementById('tc-desc').value,
  });
  alert('저장되었습니다. 홈 화면에 바로 반영됩니다.');
}

// ---------------- ROUTER ----------------
function router(){
  const hash = location.hash || '#/home';
  const parts = hash.replace('#/','').split('/');
  studentWrap();
  if(parts[0]==='home' || hash==='#/' ) return pageHome();
  if(parts[0]==='guidebook') return parts[1] ? pageGuidebookDetail(parts[1]) : pageGuidebookList();
  if(parts[0]==='schedule') return pageSchedule();
  if(parts[0]==='materials') return parts[1] ? pageMaterialDetail(parts[1]) : pageMaterials();
  if(parts[0]==='notice') return parts[1] ? pageNoticeDetail(parts[1]) : pageNoticeList();
  if(parts[0]==='qna') return pageQna();
  if(parts[0]==='survey') return pageSurvey();
  if(parts[0]==='notifications') return pageNotifications();
  if(parts[0]==='admin'){
    if(parts[1]==='attendance') return pageAdminAttendance();
    if(parts[1]==='evaluation') return pageAdminEvaluation();
    if(parts[1]==='scoreboard') return pageAdminScoreboard();
    if(parts[1]==='participants'){
      if(parts[2]==='scores') return pageAdminParticipantScores();
      if(parts[2]==='absentees') return pageAdminParticipantAbsentees();
      return parts[2] ? pageAdminParticipantDetail(parts[2]) : pageAdminParticipants();
    }
    if(parts[1]==='notices') return pageAdminNotices();
    if(parts[1]==='guidebook') return pageAdminGuidebook();
    if(parts[1]==='schedule') return pageAdminScheduleManage();
    if(parts[1]==='materials') return pageAdminMaterials();
    if(parts[1]==='today') return pageAdminToday();
    return pageAdminHome();
  }
  return pageHome();
}
window.addEventListener('hashchange', router);
router();

const splash = document.getElementById('splash');
setTimeout(() => splash.classList.add('hide'), 1200);
setTimeout(() => splash.remove(), 1700);
</script>
